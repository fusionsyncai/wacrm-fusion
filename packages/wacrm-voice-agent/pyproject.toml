[project]
name = "wacrm-voice-agent"
version = "0.1.0"
description = "LiveKit Cloud worker for wacrm WhatsApp voice agents"
requires-python = ">=3.11"
dependencies = [
  "livekit-agents[silero,turn-detector]~=1.2",
  "httpx>=0.28",
  "python-dotenv>=1.0",
]

[project.scripts]
wacrm-voice-agent = "wacrm_voice_agent.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wacrm_voice_agent"]
